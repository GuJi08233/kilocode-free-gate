version: '3.8'

services:
  kilo-gate:
    image: ghcr.io/GuJi08233/kilocode-free-gate:latest
    container_name: kilo-gate
    restart: unless-stopped
    ports:
      - "13339:13339"
    environment:
      - PORT=13339
      # 代理池配置
      - PROXY_API=https://proxy.amux.ai/api/proxies
      # - PROXY_API_2=https://your-second-pool/api/proxies
      # 轮换代理数量（增加可提高并发）
      # - SLOT_COUNT=4
      # ZenProxy 备用中继（可选，全部代理失败时降级使用）
      # - ZENPROXY_KEY=你的密钥
      # - ZENPROXY_RELAY=https://zenproxy.top/api/relay
      # 强制走 relay 模式（调试用，1=开启）
      # - FORCE_RELAY=0
      # 探活超时（ms）
      # - PROXY_PROBE_TIMEOUT=8000
      # 候选池刷新间隔（ms，5 分钟）
      # - PROXY_REFRESH_MS=300000
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:13339/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
